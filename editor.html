<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a14;
        display: flex; flex-direction: column; height: 100vh;
        font-family: 'Poppins', sans-serif; color: #fff;
        overflow: hidden;
      }

      /* ── 상단 바 ── */
      #topbar {
        height: 56px;
        background: rgba(255,255,255,0.04);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex; align-items: center;
        padding: 0 16px; gap: 8px; flex-shrink: 0;
      }
      #topbar h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 18px; font-weight: 700;
        color: #fff; margin-right: 12px; white-space: nowrap;
      }

      .sep { width: 1px; height: 28px; background: rgba(255,255,255,0.1); margin: 0 4px; flex-shrink: 0; }
      .spacer { flex: 1; }

      /* ── 팔레트 바 (2줄) ── */
      #palette-bar {
        background: rgba(255,255,255,0.03);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 6px 16px 8px;
        display: flex; flex-direction: column; gap: 6px;
        flex-shrink: 0;
      }

      /* 색상 탭 */
      #color-tabs { display: flex; gap: 6px; align-items: center; }
      .color-tab {
        width: 22px; height: 22px; border-radius: 999px;
        border: 2px solid transparent; cursor: pointer;
        transition: transform 0.12s, border-color 0.12s;
        flex-shrink: 0; padding: 0;
      }
      .color-tab:hover { transform: scale(1.1); }
      .color-tab.active { border-color: #ff9f43; transform: scale(1.15); }

      /* 팔레트 */
      #palette { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
      .palette-item {
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        padding: 4px 6px 3px;
        border: 2px solid transparent; border-radius: 8px;
        cursor: pointer; user-select: none;
        transition: border-color 0.12s, background 0.12s;
      }
      .palette-item:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
      .palette-item.selected { border-color: #ff9f43; background: rgba(255,159,67,0.12); }
      .palette-item img {
        width: 44px; height: 44px; object-fit: contain; display: block;
        background: rgba(255,255,255,0.04); border-radius: 6px; padding: 2px;
      }
      .palette-item span { font-size: 9px; font-family: 'Poppins', sans-serif; color: rgba(255,255,255,0.45); }

      /* ── 좌측 사이드바 ── */
      #sidebar {
        position: fixed; left: 0; top: 160px; bottom: 0; width: 200px;
        background: rgba(10,10,20,0.97);
        border-right: 1px solid rgba(255,255,255,0.08);
        display: flex; flex-direction: column; z-index: 50;
      }
      #sidebar-header {
        padding: 14px 16px 10px;
        font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      #sidebar-list {
        flex: 1; overflow-y: auto; padding: 8px;
      }
      #sidebar-list::-webkit-scrollbar { width: 4px; }
      #sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
      .sidebar-route {
        padding: 10px 12px; border-radius: 10px; margin-bottom: 4px;
        cursor: pointer; border: 1px solid transparent;
        transition: background 0.12s, border-color 0.12s, opacity 0.2s, transform 0.2s;
      }
      .sidebar-route:hover { background: rgba(255,255,255,0.06); }
      .sidebar-route.active {
        background: rgba(255,159,67,0.12); border-color: rgba(255,159,67,0.4);
      }
      .sidebar-route-name {
        font-size: 12px; font-weight: 600; color: #fff;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .sidebar-route-date { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }
      .sidebar-route-actions { display: none; gap: 4px; margin-top: 6px; }
      .sidebar-route:hover .sidebar-route-actions { display: flex; }
      .sidebar-route-actions button {
        background: none; border: none; cursor: pointer;
        font-size: 12px; padding: 2px 4px; border-radius: 4px;
        transition: background 0.12s; line-height: 1;
      }
      .sidebar-route-actions .btn-rename { color: #ff9f43; }
      .sidebar-route-actions .btn-rename:hover { background: rgba(255,159,67,0.15); }
      .sidebar-route-actions .btn-delete { color: #e74c3c; }
      .sidebar-route-actions .btn-delete:hover { background: rgba(231,76,60,0.15); }
      .sidebar-route.removing { opacity: 0; transform: translateX(-10px); pointer-events: none; }
      #sidebar-empty {
        font-size: 11px; color: rgba(255,255,255,0.25);
        text-align: center; padding: 16px 8px;
      }
      #sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
      #btn-sidebar-new {
        width: 100%; background: #ff9f43; color: #fff; border: none;
        border-radius: 999px; font-family: 'Poppins', sans-serif;
        font-weight: 700; font-size: 13px; padding: 8px;
        box-shadow: 0 3px 0 #c97a1e; cursor: pointer; transition: transform 0.1s;
      }
      #btn-sidebar-new:active { transform: translateY(2px); box-shadow: none; }

      /* ── 캔버스 영역 ── */
      #canvas-wrap {
        flex: 1; position: relative; overflow-y: auto; overflow-x: hidden;
        margin-left: 200px; margin-top: 0;
      }
      #canvas-wrap::-webkit-scrollbar { width: 6px; }
      #canvas-wrap::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      #canvas-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
      canvas { position: absolute; top: 0; left: 0; display: block; }

      /* ── 하단 플로팅 버튼 ── */
      .fab-bar {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 10px; z-index: 10;
      }
      .fab {
        width: 48px; height: 48px; border-radius: 999px;
        font-size: 1.2rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Poppins', sans-serif; font-weight: 700;
        position: relative; transition: transform 0.1s;
        border: none;
      }
      .fab:active { transform: translateY(2px); }
      .fab-save  { background: #ff9f43; color: #fff; box-shadow: 0 3px 0 #c97a1e; }
      .fab-play  { background: #ee5a24; color: #fff; box-shadow: 0 3px 0 #a83410; }
      .fab-reset { background: #1e1e2e; color: #aaa; border: 1.5px solid #444; }
      .fab-new   { background: #1e1e2e; color: #aaa; border: 1.5px solid #444; }
      .fab-home  { background: #1e1e2e; color: #ff9f43; border: 2px solid #ff9f43;
                   position: fixed; left: 216px; bottom: 24px; }
      .fab::after {
        content: attr(data-tip);
        position: absolute; bottom: calc(100% + 8px);
        left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: #fff;
        font-size: 11px; font-family: 'Poppins', sans-serif; font-weight: 400;
        padding: 4px 10px; border-radius: 8px; white-space: nowrap;
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
      }
      .fab:hover::after { opacity: 1; }

      #hint {
        position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
        font-size: 11px; font-family: 'Poppins', sans-serif;
        color: rgba(255,255,255,0.18); pointer-events: none; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>🧗 Route Editor</h1>
      <div class="spacer"></div>
      <select id="scroll-mode"
        style="background:#1e1e2e; color:#fff; border:1px solid #444; border-radius:8px;
               font-family:'Poppins',sans-serif; font-size:12px; padding:6px 12px;
               cursor:pointer; outline:none; flex-shrink:0;">
        <option value="follow">↕ 수직 등반</option>
        <option value="free">↔ 트래버스</option>
        <option value="fixed">⊞ 단일 화면</option>
      </select>
    </div>
    <div id="palette-bar">
      <div id="color-tabs"></div>
      <div id="palette"></div>
    </div>
    <div id="sidebar">
      <div id="sidebar-header">📋 루트 목록</div>
      <div id="sidebar-list"></div>
      <div id="sidebar-footer">
        <button id="btn-sidebar-new">+ 새 루트</button>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="fab-bar">
      <button class="fab fab-save"  id="btn-save"  data-tip="저장">💾</button>
      <button class="fab fab-play"  id="btn-play"  data-tip="게임 시작">▶</button>
      <button class="fab fab-reset" id="btn-reset" data-tip="초기화">🗑</button>
    </div>
    <button class="fab fab-home" data-tip="게임으로" onclick="window.location.href='./'">🏠</button>
    <div id="hint">클릭: 배치 &nbsp;·&nbsp; 홀드 클릭: 선택 &nbsp;·&nbsp; 우클릭: 삭제</div>
    <script>
      const _sm = document.getElementById('scroll-mode');
      _sm.value = localStorage.getItem('routeScrollMode') || 'follow';
    </script>
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>
