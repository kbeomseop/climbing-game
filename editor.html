<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a14;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: monospace;
        color: #fff;
      }

      /* ── 상단 바 ── */
      #topbar {
        height: 52px;
        background: rgba(255,255,255,0.04);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 6px;
        flex-shrink: 0;
      }
      #topbar h1 {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.3);
        margin-right: 8px;
        white-space: nowrap;
      }

      /* 팔레트 (상단 가로 나열) */
      #palette {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .palette-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 3px 5px 2px;
        border: 1.5px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
        transition: border-color 0.12s, background 0.12s;
      }
      .palette-item:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); }
      .palette-item.selected { border-color: #42a5f5; background: rgba(66,165,245,0.15); }
      .palette-item img { width: 40px; height: 40px; object-fit: contain; display: block; }
      .palette-item span { font-size: 9px; color: rgba(255,255,255,0.4); }

      .sep { width: 1px; height: 28px; background: rgba(255,255,255,0.1); margin: 0 4px; flex-shrink: 0; }
      .spacer { flex: 1; }

      button {
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-family: monospace;
        font-size: 13px;
        transition: background 0.15s;
        white-space: nowrap;
        flex-shrink: 0;
      }
      button:hover { background: rgba(255,255,255,0.14); }
      #btn-save { background: rgba(66,165,245,0.25); border-color: rgba(66,165,245,0.6); }
      #btn-save:hover { background: rgba(66,165,245,0.45); }
      #btn-new  { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.4); }
      #btn-new:hover  { background: rgba(255,80,80,0.35); }

      /* ── 캔버스 영역 ── */
      #canvas-wrap {
        flex: 1;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #canvas-wrap::-webkit-scrollbar { width: 6px; }
      #canvas-wrap::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      #canvas-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

      canvas { position: absolute; top: 0; left: 0; display: block; }

      #hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: rgba(255,255,255,0.2);
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>ROUTE EDITOR</h1>
      <div id="palette"></div>
      <div class="sep"></div>
      <div class="spacer"></div>
      <button id="btn-new">새 문제</button>
      <button id="btn-save">저장</button>
      <button id="btn-play">게임 시작</button>
    </div>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div id="hint">클릭: 배치 &nbsp;·&nbsp; 홀드 클릭: 선택 &nbsp;·&nbsp; 우클릭: 삭제</div>
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>
