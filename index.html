<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climbing Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a14; overflow: hidden; font-family: 'Poppins', sans-serif; }
      canvas { display: block; }
      video  { display: none; }

      .fab-bar {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 10px; z-index: 10;
      }
      .fab {
        width: 48px; height: 48px; border-radius: 999px;
        font-size: 1.25rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Poppins', sans-serif; font-weight: 700;
        position: relative; transition: transform 0.1s, opacity 0.15s;
        border: none;
      }
      .fab:active { transform: translateY(2px); }
      .fab-edit {
        background: #1e1e2e; color: #ff9f43;
        border: 2px solid #ff9f43;
      }
      .fab-edit:hover { opacity: 0.85; }
      .fab::after {
        content: attr(data-tip);
        position: absolute; bottom: calc(100% + 8px);
        left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: #fff;
        font-size: 11px; font-family: 'Poppins', sans-serif; font-weight: 400;
        padding: 4px 10px; border-radius: 8px; white-space: nowrap;
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
      }
      .fab:hover::after { opacity: 1; }
    </style>
  </head>
  <body>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="fab-bar">
      <button class="fab fab-edit" data-tip="편집" onclick="location.href='/editor.html'">✏️</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
