<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climbing Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a14; overflow: hidden; font-family: 'Poppins', sans-serif; }
      canvas { display: block; }
      video  { display: none; }

      /* ── 탭 바 ── */
      .tab-bar {
        position: fixed; left: 0; top: 50%; transform: translateY(-50%);
        background: rgba(15,15,30,0.9); border-radius: 0 12px 12px 0;
        display: flex; flex-direction: column; align-items: center;
        padding: 10px 8px 12px; gap: 4px; z-index: 100;
      }

      /* 섹션 라벨 */
      .tab-section-label {
        font-family: 'Poppins', sans-serif;
        font-size: 8px; font-weight: 400;
        color: rgba(255,255,255,0.3);
        letter-spacing: 0.08em; text-transform: uppercase;
        margin: 4px 0 2px; width: 100%; text-align: center;
      }
      /* 구분선 */
      .tab-divider {
        width: 32px; height: 1px;
        background: rgba(255,255,255,0.1);
        margin: 4px 0;
      }

      /* 일반 탭 버튼 */
      .tab-btn {
        width: 48px; height: 48px; border-radius: 999px;
        font-size: 1.25rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        border: 2px solid #ff9f43; background: #1e1e2e;
        color: #fff; position: relative;
        transition: background 0.15s, transform 0.1s;
        flex-shrink: 0;
      }
      .tab-btn:active { transform: scale(0.92); }
      .tab-btn.active { background: #ff9f43; }
      .tab-btn::after {
        content: attr(data-tip);
        position: absolute; left: calc(100% + 12px);
        top: 50%; transform: translateY(-50%);
        background: rgba(0,0,0,0.85); color: #fff;
        font-size: 11px; font-family: 'Poppins', sans-serif; font-weight: 400;
        padding: 4px 10px; border-radius: 8px; white-space: nowrap;
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
      }
      .tab-btn:hover::after { opacity: 1; }

      /* 비활성 버튼 */
      .tab-btn-disabled {
        background: rgba(30,30,46,0.5) !important;
        border-color: rgba(255,159,67,0.2) !important;
        color: rgba(255,255,255,0.25) !important;
        cursor: not-allowed !important;
      }
      .tab-btn-disabled:active { transform: none !important; }

      /* 준비중 뱃지 */
      .tab-btn-wrap { position: relative; display: flex; }
      .badge-soon {
        position: absolute; top: -4px; right: -4px;
        background: #444; color: #aaa;
        font-size: 8px; border-radius: 999px; padding: 1px 5px;
        font-family: 'Poppins', sans-serif; line-height: 1.5;
        pointer-events: none; white-space: nowrap;
      }

      /* ── 루트 패널 ── */
      #route-panel {
        position: fixed; left: 72px; top: 50%; transform: translateY(-50%);
        background: rgba(15,15,30,0.96); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px; padding: 16px; min-width: 220px; max-height: 60vh;
        overflow-y: auto; z-index: 99; display: none; flex-direction: column; gap: 8px;
      }
      #route-panel.open { display: flex; }
      #route-panel h3 {
        font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5);
        margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.05em;
      }
      .route-item {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; border-radius: 10px; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.03);
        transition: background 0.12s, border-color 0.12s;
      }
      .route-item:hover { background: rgba(255,159,67,0.1); border-color: rgba(255,159,67,0.3); }
      .route-item.active { background: rgba(255,159,67,0.15); border-color: #ff9f43; }
      .route-item-name { flex: 1; font-size: 13px; font-weight: 600; color: #fff; }
      .route-item-date { font-size: 10px; color: rgba(255,255,255,0.35); }
      .route-item-del {
        width: 24px; height: 24px; border-radius: 6px; border: none;
        background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4);
        cursor: pointer; font-size: 14px; display: flex; align-items: center;
        justify-content: center; transition: background 0.12s, color 0.12s;
      }
      .route-item-del:hover { background: rgba(231,76,60,0.2); color: #e74c3c; }
      #route-panel-empty {
        font-size: 12px; color: rgba(255,255,255,0.25); text-align: center; padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="tab-bar">
      <!-- 🎮 플레이 섹션 -->
      <span class="tab-section-label">🎮 플레이</span>
      <button id="btn-motion" class="tab-btn active" data-tip="모션 감지" onclick="window.toggleMotionMode()">✋</button>
      <button id="btn-mouse"  class="tab-btn"        data-tip="마우스 모드" onclick="window.toggleMouseMode()">🖱</button>

      <div class="tab-divider"></div>

      <!-- 📂 루트 섹션 -->
      <span class="tab-section-label">📂 루트</span>
      <button id="btn-routes" class="tab-btn" data-tip="루트 선택" onclick="window.toggleRoutePanel()">📋</button>
      <button class="tab-btn" data-tip="편집" onclick="location.href='./editor.html'">✏️</button>

      <div class="tab-divider"></div>

      <!-- 👥 멀티 섹션 -->
      <span class="tab-section-label">👥 멀티</span>
      <div class="tab-btn-wrap">
        <button class="tab-btn tab-btn-disabled" data-tip="멀티플레이">🤝</button>
        <span class="badge-soon">준비중</span>
      </div>
    </div>

    <div id="route-panel">
      <h3>루트 선택</h3>
      <div id="route-list"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
